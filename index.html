zimo ANTES da lei, por amor e honra a Melquisedeque (Gn 14). Foi presente, não pagamento.","Levi recebeu o dízimo DEPOIS, por lei, como salário para sustentar o templo (Nm 18:21). Era obrigatório.","Jesus não veio da tribo de Levi, mas de Judá. Ele é sacerdote segundo Melquisedeque, não segundo Arão.","Se o sacerdócio mudou, a lei que sustentava o antigo sacerdócio também mudou."],table:[{label:"ORIGEM",abraao:"Gratidão após vitória",levi:"Mandamento da Lei"},{label:"MOTIVO",abraao:"Honra voluntária",levi:"Sustento obrigatório"},{label:"FREQUÊNCIA",abraao:"Uma vez (Gn 14)",levi:"Anual, mensal, sistêmico"},{label:"NATUREZA",abraao:"Presente",levi:"Boleto / Imposto"}]},kids:{intro:"Imagine dois copos: um escrito LEI e outro AMOR. Abraão encheu o copo AMOR porque quis!",points:["Abraão ganhou uma batalha e ficou feliz. Deu um presente pra Deus, tipo obrigado!","Depois, Deus fez uma regra pro povo de Israel ajudar os padres do templo. Era tipo mesada obrigatória.","Jesus veio e disse: agora não é mais mesada obrigatória. É presente de coração.","Deus não quer seu dinheiro com carinha feia. Quer seu coração alegre!"]}}},{id:2,title:"Quem é Melquisedeque? O Rei Misterioso",ref:"Gn 14 / Hb 7:3",color:"bg-stone-50 border-stone-200",summary:"Sem pai, sem mãe, sem genealogia. Rei de Justiça e Rei de Paz.",content:{normal:{intro:"Ele aparece do nada em Gênesis 14, abençoa Abraão e some. Quem é?",points:["Rei de Salém (que significa Paz) e Sacerdote do Deus Altíssimo.","Hebreus 7:3 diz: sem pai, sem mãe, sem genealogia, sem princípio de dias nem fim de vida.","Isso não significa que ele não teve pais, mas que seu sacerdócio não depende de genealogia como Levi.","Ele é TIPO (sombra, figura) de Cristo: Rei e Sacerdote ao mesmo tempo. Em Israel ninguém podia ser os dois.","Abraão, o pai da fé, deu dízimo PARA ELE. Ou seja, Melquisedeque é maior que Abraão. E Jesus é segundo essa ordem."]},kids:{intro:"Um super-herói misterioso que aparece pra ajudar Abraão!",points:["Nome difícil: Mel-qui-se-de-que. Significa Meu Rei é Justiça!","Ele era rei e também padre. Na época, ninguém podia ser os dois. Só ele!","A Bíblia não fala da família dele de propósito, pra mostrar que Jesus também não tem fim.","Até Abraão, que era muito importante, respeitou muito ele!"]}}},{id:3,title:"Malaquias 3 Desvendado",ref:"Ml 3:8-10",color:"bg-orange-50 border-orange-200",summary:"Roubará o homem a Deus? Sim, mas quem estava roubando eram os sacerdotes.",content:{normal:{intro:"O texto mais usado para gerar culpa. Vamos ler o contexto, com carinho e sem medo.",points:["Malaquias 1:6 até 3:5 Deus está brigando COM OS SACERDOTES de Levi, não com o povo.","Eles roubavam de Deus oferecendo animais cegos e mancos no altar (Ml 1:8). E ainda roubavam os dízimos do povo.","Malaquias 3:9 'Com maldição sois amaldiçoados' - no plural. A nação toda sofria porque os líderes desviavam.","Ml 3:10 'Trazei todos os dízimos à casa do tesouro' - Deus ordena os SACERDOTES ladrões a devolverem o que já tinham roubado do povo!","O povo nunca foi amaldiçoado por não dizimar. A maldição da lei já foi cravada na cruz (Gl 3:13)."]},kids:{intro:"Deus brigou com os líderes que estavam roubando!",points:["Os padres estavam pegando o dinheiro do povo e não fazendo o certo.","Deus disse: 'Vocês estão me roubando!' para os líderes, não para as crianças e famílias.","É como se o monitor da sala roubasse o lanche dos colegas e o professor brigasse com o monitor.","Jesus já pagou tudo. Não tem mais maldição pra quem está nEle!"]}}},{id:4,title:"100% é Dele - A Parábola do Gerente",ref:"Lc 16:1-13",color:"bg-emerald-50 border-emerald-200",summary:"Você não é dono, é mordomo. Tudo é dEle.",content:{normal:{intro:"Se 10% é de Deus, 90% é meu? Que teologia pobre! Na graça, 100% é dEle.",points:["Somos mordomos, não proprietários (1Co 4:2).","O bom mordomo pergunta: Senhor, o que queres que eu faça com TEUS 100%?","Caixa 1: Sustento (suas necessidades básicas)","Caixa 2: Família e Futuro (sabedoria)","Caixa 3: Reino (generosidade, alegria, sem cálculo)","Não é lei, é sabedoria. Não é porcentagem, é relacionamento."]},kids:{intro:"Você cuida do videogame do seu amigo? Você não é dono, mas cuida bem!",points:["Deus nos deu tudo emprestado pra cuidar.","A gente divide em 3 caixinhas pra ser organizado.","Caixinha 1: Pra mim comer e vestir","Caixinha 2: Pra minha família","Caixinha 3: Pra ajudar outras pessoas e falar de Jesus!"]}}},{id:5,title:"Devolver, Pagar ou Ofertar?",ref:"At 17:25 / 1Cr 29:14",color:"bg-blue-50 border-blue-200",summary:"Deus não precisa de nada. Mas nos convida a participar.",content:{normal:{intro:"Palavras criam mentalidade. Vamos ajustar o vocabulário à graça.",points:["DEVOLVER: 'Tava comigo, mas é Dele, então devolvo.' Mentalidade de dívida.","PAGAR: 'Tenho que pagar senão sou roubado.' Mentalidade de boleto e medo.","OFERTAR: 'É tudo dEle, quero participar com alegria!' Mentalidade de filho.","Atos 17:25 - Deus não é servido por mãos humanas como se precisasse de algo.","1 Crônicas 29:14 - 'Porque tudo vem de ti, e do que é teu te damos.' Davi entendeu!"]},kids:{intro:"Qual palavra é mais legal?",points:["Pagar boleto é chato né?","Devolver é tipo: peguei emprestado.","Ofertar é: eu quero dar um presente porque amo!","Deus não precisa do seu dinheiro. Ele te ama com ou sem dinheiro.","Mas Ele fica feliz quando você divide com alegria!"]}}},{id:6,title:"Deus abençoa através de pessoas",ref:"2Co 9:10-11",color:"bg-violet-50 border-violet-200",summary:"Você é o cano, não a caixa d'água. A água passa por você.",content:{normal:{intro:"2 Coríntios 9:11 - 'Para que em tudo enriqueçais para toda a generosidade.'",points:["Deus é a fonte. Você é o cano. Seu vizinho é o jardim.","Cano sujo ou entupido (avareza, medo) não deixa a água passar.","Deus não te abençoa PARA você. Ele te abençoa ATRAVÉS de você.","Quanto mais generoso, mais a fonte aumenta a pressão. Não para você acumular, mas para irrigar mais!","Isso não é barganha. É fluxo de um coração transformado."]},kids:{intro:"Você já viu um cano de jardim?",points:["Deus é como a caixa d'água lá em cima.","Você é o cano!","Se o cano fica fechado, a água não sai. Se abre, molha as plantinhas!","Deus quer que você deixe o amor dEle passar por você pra outras pessoas.","Quanto mais você divide, mais feliz você fica!"]}}},{id:7,title:"Versão para 11 anos - O Time",ref:"Exclusivo Kids",color:"bg-yellow-50 border-yellow-200",summary:"Futebol, copos e alegria. Evangelho que criança entende.",content:{normal:{intro:"Como explicar graça para uma criança de 11 anos? Com futebol!",points:["TIME DA LEI: técnico grita 'tem que fazer 10 gols senão tá fora!'. Todo mundo com medo.","TIME DA GRAÇA: técnico (Jesus) já fez 100 gols por você. Agora joga livre, por amor à camisa!","Copo LEI: tem que encher até a boca, senão Deus fica bravo. Cansativo!","Copo AMOR: Jesus já encheu. O que transborda de você é alegria, não obrigação.","Deus não tem filhos com medo. Tem filhos amados jogando bola no quintal!"]},kids:{intro:"Já imaginou dois times?",points:["Time 1: Se você não fizer gol, perde! Que pressão!","Time 2: O capitão Jesus já fez todos os gols! Agora joga só pra se divertir!","Qual time você quer?","Copo da lei = pesar e medir. Copo do amor = já está cheio!","Deus te ama muito, muito, muito! Sem boletos!"]}}},{id:8,title:"Entropia Espiritual / Fé e Razão / Ciência e Fé",ref:"Em breve",color:"bg-zinc-50 border-zinc-200",summary:"Títulos clássicos do acervo original - estudos em preparação.",content:{normal:{intro:"Mantendo a tradição do acervo original, estes livretos estão em curadoria.",points:["Entropia Espiritual: tudo tende à desordem sem manutenção - por que precisamos de comunhão diária.","Fé e Razão: crer não é ser irracional. É confiar com evidências.","Ciência e Fé: Deus não tem medo de microscópio.","Em breve, com linguagem simples e profunda."]},kids:{intro:"Em breve desenhos e histórias novas!",points:["Aguarde novidades com jogos e ilustrações."]}}}];function
